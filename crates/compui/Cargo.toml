[package]
name = "compui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
compcore = { git = "https://github.com/roworu/compcore", tag = "v0.1.4" }
compui-proto = { version = "0.1.0", path = "../compui-proto" }
libc = "0.2.191"
portable-pty = "0.9.0"
serde_json = "1.0.154"
unicode-width = "0.2.3"
vte = "0.15.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
pangocairo = "0.22.9"
serde = "1.0.229"
zbus = "5.19.0"

[build-dependencies]
serde_json = "1.0.154"

[dev-dependencies]
vt100 = "0.18.1"

[[bench]]
name = "wrapper"
harness = false
