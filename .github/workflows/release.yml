# on a v* tag: test, build compui for linux (x86_64, arm64) and macos (arm64, swift host linked in),
# and attach compui-<os>-<arch>.tar.gz to a github release, which install.sh downloads
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # linux in ubuntu 26.04: 24.04 has no gtk4-layer-shell package
        include:
          - { runner: ubuntu-24.04, container: "ubuntu:26.04", name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, container: "ubuntu:26.04", name: linux-arm64 }
          - { runner: macos-latest, container: "", name: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - if: runner.os == 'Linux'
        run: |
          apt-get update && apt-get install -y build-essential curl git pkg-config libgtk-4-dev libgtk4-layer-shell-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: cargo test
      - run: ./build.sh
      - run: tar -C dist -czf compui-${{ matrix.name }}.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: compui-${{ matrix.name }}
          path: compui-${{ matrix.name }}.tar.gz
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" compui-*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
